<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>opentui-git</title>
    <!-- Auto-spawn picks a random local port (PORT=0), so allow any
         loopback port. Restricted to localhost-only origins. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' data: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
