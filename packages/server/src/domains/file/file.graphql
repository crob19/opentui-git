type FileReadResult {
  content: String!
  mtime: String!
}

type FileWriteResult {
  success: Boolean!
  conflict: Boolean!
  message: String
}

type StageResult {
  success: Boolean!
}

extend type Query {
  readFile(path: String!): FileReadResult!
  repoPaths: [String!]!
}

extend type Mutation {
  writeFile(path: String!, content: String!, expectedMtime: String): FileWriteResult!
  stageFile(path: String!): StageResult!
  unstageFile(path: String!): StageResult!
  stageFiles(paths: [String!]!): StageResult!
  unstageFiles(paths: [String!]!): StageResult!
  stageAll: StageResult!
  unstageAll: StageResult!
}
