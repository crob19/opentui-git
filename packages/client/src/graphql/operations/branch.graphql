query Branches {
  branches {
    current
    all
    branches {
      name
      commit
      label
      current
      ahead
      behind
    }
  }
}

query DefaultBranch {
  defaultBranch
}

mutation CreateBranch($name: String!, $source: String) {
  createBranch(name: $name, source: $source) {
    success
    branch
  }
}

mutation CheckoutBranch($name: String!) {
  checkoutBranch(name: $name) {
    success
    branch
  }
}

mutation RenameBranch($oldName: String!, $newName: String!) {
  renameBranch(oldName: $oldName, newName: $newName) {
    success
    branch
  }
}

mutation DeleteBranch($name: String!, $force: Boolean) {
  deleteBranch(name: $name, force: $force) {
    success
    branch
  }
}

mutation MergeBranch($name: String!) {
  mergeBranch(name: $name) {
    success
    merges
    conflicts
    result
  }
}
